name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag against manifest version
        run: node scripts/release-check.mjs "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:ext
      - name: Zip extension
        run: cd dist/ext && zip -r "../../qommit-${GITHUB_REF_NAME#v}.zip" . -x "*.map"
      - name: Check manifest.json is a top-level zip entry
        run: unzip -Z1 "qommit-${GITHUB_REF_NAME#v}.zip" | grep -qx manifest.json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "qommit-${GITHUB_REF_NAME#v}.zip" --title "$GITHUB_REF_NAME" --generate-notes
